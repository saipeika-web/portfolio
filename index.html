<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ИП Сайпеева · Магазинчик</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f0fa;color:#251735;font:16px/1.5 system-ui,sans-serif}header,main,footer{max-width:1200px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}nav,.actions{display:flex;gap:8px;flex-wrap:wrap}button,a.action{font:inherit;font-weight:650;border:1px solid #6333a0;border-radius:12px;padding:10px 16px;background:white;color:#43216d;cursor:pointer;text-decoration:none}button:hover,a.action:hover{background:#e8d8ff}button:focus-visible,a:focus-visible{outline:3px solid #8c55db}h1{font-size:clamp(29px,4vw,54px);line-height:1.08;margin:0 0 18px}h2{line-height:1.15}.scene{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:24px;align-items:center;background:#fff;border-radius:24px;padding:24px}.host{width:100%;max-height:450px;object-fit:contain;border-radius:18px}.shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:12px;background:#e8dcf6;border-radius:16px}.item{min-height:120px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;text-align:center;overflow-wrap:anywhere}.item span{font-size:32px}.dialog{background:#fff;border:1px solid #d6c2ed;border-radius:18px;padding:20px;display:grid;grid-template-columns:1.5fr 1fr;gap:20px}.dialog p{margin:6px 0}.speaker{color:#6533a7;font-weight:800}.gallery{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}.media{width:100%;height:390px;object-fit:contain;background:#eee7f5;border-radius:12px}.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.thumbs button{padding:7px 12px}.selected{background:#713bb2!important;color:white!important}.route{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0}.muted{color:#695b78}dl{margin:0}dt{font-weight:bold;margin-top:12px}dd{margin:0}@media(max-width:700px){.scene,.gallery,.dialog{grid-template-columns:1fr}.host{max-height:230px}.shelf{grid-template-columns:repeat(2,minmax(0,1fr))}.media{height:300px}header,main,footer{padding:12px}.scene{padding:14px}}section{margin-top:24px}.item{min-width:0;word-break:normal;overflow-wrap:break-word}.actions button{flex:1;min-width:120px}video.media{height:auto;max-height:520px;background:#21182d}</style><header><strong>ИП САЙПЕЕВА · магазинчик</strong><nav><button onclick="go('home')">Вход</button><button onclick="go('shop')">Проекты</button><button onclick="go('about')">Досье</button><button onclick="go('end')">На связи</button></nav></header><main id="main"></main><footer><div class="dialog"><div><div class="speaker">АЙСЫЛУ</div><p id="speech"></p></div><div class="actions" id="actions"></div></div></footer><script>const projects=[{"title": "Шпионский квест", "type": "Реализованный", "object": "Шпионский чемодан", "category": "Фестивальная активация", "role": "Автор идеи, инициатор партнёрства", "task": "Привлечь внимание к товарам собственной торговой марки Самоката и создать повод для UGC.", "idea": "Лазерный лабиринт, который нужно пройти, чтобы добраться до продуктов Самоката.", "result": "8 600+ участников за три дня; более 30 упоминаний в соцсетях.", "line": "Тут всё засекречено, кроме результатов: 8 600 человек прошли испытание."}, {"title": "Искры добра", "type": "Реализованный", "object": "Бенгальские огни", "category": "Благотворительная акция", "role": "Автор идеи", "task": "Поддержать новогоднюю коммуникацию «Легко дарить радость» и благотворительность.", "idea": "За покупки в Самокате пользователи получали промокоды для персональных сборов в приложении «Помощь». Сделали интеграцию в приложение, ролик и мерч.", "result": "Закрыто 29 благотворительных сборов.", "line": "Искры здесь настоящие — бенгальские. А помощь людям тоже вполне реальная."}, {"title": "Дроп украшений", "type": "Реализованный", "object": "Шкатулка с шармами", "category": "Брендовая коллаборация", "role": "Автор идеи", "task": "Создать трендовый мерч и усилить восприятие Самоката как lifestyle-бренда.", "idea": "Вместе с брендом «Зяблик» создали браслет с шармами в виде круассана, мороженого и сыра.", "result": "Применения промокодов — в 3 раза выше плана; охват — в 2 раза выше плана.", "line": "Круассан, мороженое и сыр. Да, это украшения, и да, всё серьёзно."}, {"title": "Параллельные вселенные", "type": "Реализованный", "object": "Курьерская сумка", "category": "Игровой спецпроект", "role": "Автор идеи, проджект-менеджер", "task": "Рассказать о собственной торговой марке через игру и сторителлинг.", "idea": "Лендинг с тремя мини-играми про курьера Максима, который попадает в параллельную вселенную и помогает Сумке Самокат. После игр пользователи получали промокоды.", "result": "ROI 349%; среднее время игры — 15 минут; доходимость — 73%.", "line": "Курьерская сумка, которая может увести тебя в другую вселенную. Проверено."}, {"title": "Planto — «Так вкусно… и так вкусно»", "type": "Реализованный", "object": "Упаковка растительного напитка Planto", "category": "Рекламная кампания", "role": "Разработка креативной концепции, рекламного лайна, сценария ролика и направлений key visual.", "task": "Показать, что растительные напитки Planto позволяют сохранить вкус привычных блюд, и рассказать о разнообразии продуктовой линейки.", "idea": "Масштабируемый лайн «Так вкусно… и так вкусно… и так тоже вкусно…» связывает разные ситуации: кофе, домашнюю готовку, десерты и спорт. Брендовый лайн — «Пост вкуснее с Planto». Документальная съёмка с живой камерой и искренними реакциями.", "result": "Разработаны концепция кампании, сценарий 15-секундного ролика, раскадровка и варианты key visual.", "line": "В этой кампании вкусно и так, и так — даже когда выбираешь растительное молоко."}, {"title": "В поисках лимонадов", "type": "Реализованный", "object": "Алюминиевая банка", "category": "AR-игра", "role": "Автор идеи, проджект-менеджер", "task": "Повысить узнаваемость напитков СТМ и стимулировать использование промокодов.", "idea": "AR-игра, в которой персонажей-лимонадов нужно искать дома и в городских локациях.", "result": "Летняя игровая активация с AR-механикой.", "line": "Лимонады разбежались по городу. Пришлось организовать поиски."}, {"title": "Dementia Time × Swatch", "type": "MADS", "object": "Синие часы", "category": "Учебная концепция", "role": "Концепция с обучения MADS", "task": "Обратить внимание на деменцию и изменения когнитивных способностей.", "idea": "Коллаборация Swatch с фондом «Альцрус»: циферблаты часов показывают, как может искажаться восприятие времени.", "result": "Учебный кейс MADS.", "line": "Время здесь ведёт себя непривычно — и в этом смысл идеи."}, {"title": "Bread Around the Head", "type": "MADS", "object": "Пакет с хлебом", "category": "Учебная концепция", "role": "Концепция с обучения MADS", "task": "Обратить внимание на важную общественную тему через упаковку.", "idea": "Концепция с хлебом и упаковкой как основным носителем сообщения.", "result": "Учебный кейс MADS.", "line": "Хлеб как носитель идеи. Иногда упаковка говорит громче рекламы."}, {"title": "Faptastic Victim", "type": "MADS", "object": "Видеокассета", "category": "Видеокейс", "role": "Работа на курсе «Концептинг» MADS", "task": "Разработать видеокейс для выпускной работы.", "idea": "Видео-кейс Faptastic Victim.", "result": "Золото выпускных работ на курсе «Концептинг».", "line": "На этой полке есть золото. И оно вполне заслуженно отмечено в портфолио."}];const media=[["assets/media-01.png"], ["assets/media-02.webp", "assets/media-03.webp", "assets/media-04.webp", "assets/media-05.mp4"], ["assets/media-06.webp"], ["assets/media-07.webp", "assets/media-08.webp"], ["assets/media-09.webp", "assets/media-10.webp", "assets/media-11.webp", "assets/media-12.webp", "assets/media-13.webp", "assets/media-14.webp", "assets/media-15.mp4"], ["assets/media-16.webp"], ["assets/media-17.webp"], ["assets/media-18.webp"], ["assets/media-19.webp"]];const art="assets/media-20.webp";const main=document.getElementById('main');const host=()=>`<img class="host" src="${art}" alt="Иллюстрация хозяйки магазинчика">`;let current='',idx=0, slide=0,urls=[];function clearVideo(){main.querySelectorAll('video').forEach(v=>{v.pause();v.removeAttribute('src');v.load()});urls.forEach(u=>URL.revokeObjectURL(u));urls=[]}function talk(t,opts){document.getElementById('speech').textContent=t;const a=document.getElementById('actions');a.replaceChildren();opts.forEach(([t,f])=>{let b=document.createElement('button');b.textContent=t;b.onclick=f;a.append(b)})}function go(s){clearVideo();current=s;let content='';if(s==='home'){content=`<h1>Добро пожаловать в мой магазинчик</h1><p>Здесь я собрала свои проекты. Выбирайте, куда заглянем сначала.</p><div class="route"><button onclick="go('shop')">01 · Витрина</button> → <button onclick="go('about')">02 · Досье</button> → <button onclick="go('end')">03 · На связи</button></div>`;talk('Привет! Я хозяйка этого магазинчика. Давайте покажу, что здесь есть.',[['Посмотреть проекты',()=>go('shop')],['Познакомиться',()=>go('about')]])}if(s==='shop'){content='<h1>Витрина проектов</h1><div class="shelf">'+projects.map((p,i)=>`<button class="item" onclick="openCase(${i})"><span aria-hidden="true">${['🕶️','🎇','💎','🎒','🥛','🥤','⌚','🍞','🎬'][i]}</span>${p.title}</button>`).join('')+'</div>';talk('Выбирайте любой предмет на полке, и я расскажу историю проекта.',[['Открыть досье',()=>go('about')],['Завершить экскурсию',()=>go('end')]])}if(s==='about'){content='<h1>Досье ИП</h1><h2>Айсылу Сайпеева</h2><p>Креатор и креативный продюсер</p><dl><dt>12.2021 — 06.2022</dt><dd>Младший креативный продюсер, Самокат</dd><dt>07.2022 — 08.2024</dt><dd>Старший креативный продюсер, Самокат</dd><dt>09.2024 — 01.2025</dt><dd>Куратор креативных продюсеров, Самокат</dd><dt>С 02.2025</dt><dd>Фриланс-проекты</dd><dt>С 04.2026</dt><dd>Креатор, «Золотые тигры»</dd></dl><p><a href= t.createElement('video');v.className='media';v.controls=true;v.playsInline=true;v.preload='metadata';v.src=vsrc;const wrap=document.createElement('section');wrap.innerHTML='<h2>Видео проекта</h2>';wrap.append(v);main.append(wrap)}const driveVideos={1:['1-UQH-H-RbXTviKNLcI1gClBPWxEFK3Gr'],4:['1-YSihJWveqtll1l565GW6JQLbFisrqgL'],5:['1NtBsEpOHS_UPkZiHvJmtsnHXsL9fx9W3'],8:['1_fNpYp0izeu0cAmI8JXkRwateW1i4Lqk']};for(const id of (driveVideos[idx]||[])){const wrap=document.createElement('section');wrap.innerHTML=`<h2>${m.some(x=>x.endsWith('.mp4'))?'Оригинал видео на Google Drive':'Видео проекта'}</h2><iframe title="Видео проекта" src="https://drive.google.com/file/d/${id}/preview" allow="autoplay; fullscreen" allowfullscreen loading="lazy" style="width:100%;height:420px;border:0;border-radius:12px;background:#eee7f5"></iframe><p><a class="action" href="https://drive.google.com/file/d/${id}/view" target="_blank" rel="noopener">Открыть оригинал видео</a></p>`;main.append(wrap)}talk(p.line,[['К витрине',()=>go('shop')],['Следующий проект',()=>openCase((idx+1)%projects.length)]])}go('home');</script></html>
