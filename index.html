<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f4edff">
  <meta name="description" content="Магазинчик креативных проектов Айсылу Сайпеевой.">
  <title>Точка Портфолио (ИП Сайпеева)</title>
  <link rel="preload" href="assets/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script src="projects.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">К содержанию</a>
  <header class="top">
    <div class="header-inner">
      <a class="brand" data-page="home" href="#home" aria-label="ИП Сайпеева, ко входу">
        <span class="brand-sign" aria-hidden="true">✦</span>
        <span>ИП Сайпеева</span>
      </a>
      <nav aria-label="Разделы магазинчика">
        <a data-page="shelf" href="#shelf">Витрина</a>
        <a data-page="about" href="#about">Об ИП</a>
      </nav>
    </div>
  </header>
  <main id="main" class="main" tabindex="-1"></main>
  <footer class="dialogue-frame" aria-label="Реплика Айсылу" hidden>
    <div class="dialogue">
      <div class="dialogue-avatar pose-welcome" aria-hidden="true"></div>
      <div class="dialogue-copy">
        <span class="speaker">Айсылу</span>
        <p id="speech"></p>
        <nav id="dialogue-actions" class="dialogue-actions" aria-label="Дальше" hidden></nav>
      </div>
    </div>
  </footer>
  <dialog id="lightbox" aria-label="Материал проекта крупным планом">
    <button class="icon-button lightbox-close" type="button" aria-label="Закрыть просмотр">×</button>
    <img alt="">
    <p></p>
  </dialog>
  <noscript>Чтобы открыть витрину и страницы проектов, включите JavaScript.</noscript>

</html>
